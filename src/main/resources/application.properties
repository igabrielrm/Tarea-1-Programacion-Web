# =====================================================================================
#  SPRING BOOT APPLICATION - MAIN CONFIGURATION
#  File: src/main/resources/application.properties
#
#  Spring Boot reads this file on startup and turns every property into an
#  "Environment Property" that the classes read with @Value or @ConfigurationProperties.
# =====================================================================================


# =====================================================================================
#  1) EMBEDDED WEB SERVER (Tomcat)
# =====================================================================================
# Port where the API listens. The Vanilla JS frontend will call
# http://localhost:8080/api/products
server.port=8080

# Base path of the application. If changed, every endpoint moves accordingly.
server.servlet.context-path=/


# =====================================================================================
#  2) POSTGRESQL CONNECTION (DataSource)
#  This is the part you need so the API can reach your database.
# =====================================================================================
# JDBC URL: protocol://host:port/database_name
#   - jdbc:postgresql  -> the PostgreSQL driver
#   - localhost         -> local server
#   - 5432              -> the default PostgreSQL port
#   - products_db       -> the name of the database you must create
spring.datasource.url=jdbc:postgresql://localhost:5432/products_db

# The PostgreSQL user (the superuser you created during the installation).
spring.datasource.username=postgres

# The password of that user. CHANGE THIS to your own one.
# (Safer alternative: read it from an environment variable)
# spring.datasource.password=${DB_PASSWORD}
spring.datasource.password=nadie

# The JDBC driver class. Spring detects it on its own, but declaring it is more explicit.
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================================================
#  3) CONNECTION POOL (HikariCP)
#  Spring Boot enables it by default. These properties tune its behaviour.
# =====================================================================================
# Maximum number of connections opened against PostgreSQL at the same time.
spring.datasource.hikari.maximum-pool-size=10

# Time (ms) a request waits for a free connection from the pool.
spring.datasource.hikari.connection-timeout=30000

# Minimum and idle connections kept open even when they are not being used.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime (ms) of a pooled connection.
spring.datasource.hikari.max-lifetime=1800000


# =====================================================================================
#  4) JPA / HIBERNATE (object <-> table mapping)
# =====================================================================================
# What to do with the database schema on startup:
#   update  -> creates the table if missing and adds new columns (ideal for development)
#   create  -> drops and recreates every table on each startup (IT WIPES YOUR DATA!)
#   validate-> does not touch anything, it only checks that the schema matches (ideal for production)
#   none    -> does nothing
spring.jpa.hibernate.ddl-auto=update

# Prints on the console the SQL that Hibernate executes. Extremely useful to learn and
# to defend the project in class: you can see the real INSERT/UPDATE/DELETE against PostgreSQL.
spring.jpa.show-sql=true

# Formats that SQL so it is readable (line breaks and indentation).
spring.jpa.properties.hibernate.format_sql=true

# SQL dialect: it tells Hibernate which syntax to use (PostgreSQL, MySQL, Oracle...).
# Spring detects it from the driver on the classpath; we keep it explicit anyway.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# open-in-view=false -> closes the JPA session at the end of every request.
# It avoids the classic "LazyInitializationException" and it is the recommended setting.
spring.jpa.open-in-view=false


# =====================================================================================
#  5) INITIAL DATA (data.sql)
# =====================================================================================
# "always" -> runs src/main/resources/data.sql on every startup.
# On PostgreSQL it does not run by default (only on embedded databases), hence this line.
spring.sql.init.mode=always

# defer-datasource-initialization=true -> waits until Hibernate creates the table
# BEFORE running data.sql. Without this, the INSERT would fail because the table does not exist yet.
spring.jpa.defer-datasource-initialization=true

# If data.sql fails, the application must NOT stop (useful during development).
spring.sql.init.continue-on-error=true

# Forces the reading of data.sql as UTF-8. Without this, Spring uses the default charset
# of the system and on Windows the accents and the "\u00f1" get corrupted in the database.
spring.sql.init.encoding=UTF-8


# =====================================================================================
#  6) CORS  (origins of the Vanilla JS frontend)
#  These values are read by the class com.tienda.products.config.CorsConfig with @Value.
# =====================================================================================
# Allowed origins, separated by commas. Each "origin" = protocol + host + port.
#   5500 -> VS Code Live Server (the most used for Vanilla JS)
#   3000 -> default port of React/Vite (in case the frontend changes its framework)
#   8081 -> in case you serve the Vanilla JS frontend with another server
#   5173 -> Vite
# Remember: the ORIGIN is the one of the FRONTEND, not the backend (the backend is http://localhost:8080).
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8081,http://localhost:5173


# =====================================================================================
#  7) ERROR HANDLING
# =====================================================================================
# Includes the real exception message in the Spring error response.
server.error.include-message=always

# Date format in the logs: ISO-8601 (easier to read and to sort).
spring.jackson.serialization.write-dates-as-timestamps=false
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss

# Forces UTF-8 in the HTTP requests and responses (accents, \u00f1, emojis...).
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# =====================================================================================
#  8) LOGS
# =====================================================================================
# Log level of Spring: INFO shows the startup and the requests, DEBUG shows the SQL.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.tienda.products=DEBUG
