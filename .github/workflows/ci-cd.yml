# =====================================================================================
#  CI/CD - Continuous Integration and Continuous Delivery
#
#  Runs on every push and every pull request targeting main or dev.
#
#  Job 1 (test)     compiles the code and runs the whole test suite with Maven.
#  Job 2 (package)  only runs if the tests passed, and produces the executable .jar.
#
#  The "CD" half of the name is where a deployment job would be added (push the image
#  to a registry and deploy it). It is left out on purpose: it would need credentials
#  and a real server, and a fake deploy step in a class project is worse than none.
# =====================================================================================

name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The token of the workflow is read-only: it cannot modify the repository.
permissions:
  contents: read

# If two commits arrive almost at the same time, the older run is cancelled so the
# newest one is the only result that matters (and no minutes are wasted).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_CLI_OPTS: '-B --no-transfer-progress'

jobs:

  # -----------------------------------------------------------------------------------
  #  JOB 1 - TESTS
  # -----------------------------------------------------------------------------------
  test:
    name: Run the test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Caches ~/.m2 based on the hash of pom.xml: the second run downloads nothing.
          cache: maven

      # No database is needed: the service tests mock the repository (Mockito) and the
      # controller tests use MockMvc, which does not start Tomcat nor open a connection.
      - name: Run the tests
        run: mvn ${{ env.MAVEN_CLI_OPTS }} test

      # Surefire reports are uploaded even when the job fails, so the reason of the
      # failure can be downloaded from the run page instead of reproducing it locally.
      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

  # -----------------------------------------------------------------------------------
  #  JOB 2 - EXECUTABLE JAR
  # -----------------------------------------------------------------------------------
  package:
    name: Build the executable JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # "-DskipTests" is safe here: "needs: test" guarantees the tests already passed
      # in the previous job, so running them twice would only waste time.
      - name: Package the application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Upload the JAR
        uses: actions/upload-artifact@v4
        with:
          name: products-api-jar
          path: target/*.jar
          retention-days: 7
          if-no-files-found: error
