# =====================================================================================
#  DOCKER COMPOSE - PostgreSQL + Spring Boot API
#
#  Two containers that talk to each other over a private network:
#
#      docker compose up -d --build     start the database and the API
#      docker compose logs -f api       follow the API logs
#      docker compose ps                see the state (healthy / starting)
#      docker compose down              stop everything
#      docker compose down -v           stop AND delete the data volume
#
#  From the host, the API answers on http://localhost:8080 and PostgreSQL on
#  http://localhost:5433 (port chosen so it does not clash with a local installation).
#
#  TUNED FOR A SMALL CLOUD INSTANCE (AWS t3.micro = 1 GB of RAM):
#  the JVM is capped at 384 MB of heap, the PostgreSQL buffers are halved and the JDBC
#  pool is reduced. Together they leave room for the operating system, which is what
#  stops the instance from swapping or killing the containers.
# =====================================================================================

services:

  # -----------------------------------------------------------------------------------
  #  DATABASE
  #
  #  The service is called "products-db". Docker's internal DNS gives every service a
  #  name, and that name is what the API uses as the database host:
  #      jdbc:postgresql://products-db:5432/products_db
  #                         ^^^^^^^^^^^ service name, NOT localhost
  # -----------------------------------------------------------------------------------
  products-db:
    image: postgres:16-alpine
    # Same value as the service name, so "docker ps", "docker logs" and the DNS name all
    # use one single word and there is nothing to remember.
    container_name: products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Memory tuning for a 1 GB instance. The official image starts with
    # shared_buffers = 128 MB; halving it frees 64 MB that the JVM needs more.
    # max_connections = 30 is far more than this project needs (the API pool is 5) and
    # every PostgreSQL connection costs RAM on the server side.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    ports:
      # Host port : container port.
      # The container always listens on 5432 inside its own network; only the left
      # value can be changed. It defaults to 5433 because this machine already has a
      # local PostgreSQL 18 owning 5432. Override it with the POSTGRES_PORT variable.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Named volume: the data survives "docker compose down" and container rebuilds.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready answers only when PostgreSQL is really accepting connections.
      # The API waits for this before starting (see depends_on below).
      test: ["CMD-SHELL", "pg_isready -U postgres -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - products-network

  # -----------------------------------------------------------------------------------
  #  API  (built from the Dockerfile in this same folder)
  # -----------------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: products-api:1.0.0
    container_name: products-api
    restart: unless-stopped
    depends_on:
      products-db:
        # "service_healthy" waits for the healthcheck above. A simple "depends_on"
        # would only wait for the container to be CREATED, not for PostgreSQL to be
        # ready, and the API would crash on the first JDBC connection attempt.
        condition: service_healthy
    environment:
      # --- JVM MEMORY (the reason the API would not start on a t3.micro) --------------
      # The Dockerfile entrypoint runs:  java $JAVA_OPTS -jar app.jar
      # Without a cap the JVM sizes its heap from the RAM of the HOST, on a 1 GB
      # instance it tries to reserve far more than the machine has, and the kernel
      # kills the container (OOM, exit code 137).
      JAVA_OPTS: "-Xmx384m -Xms128m"

      # --- DATABASE CONNECTION --------------------------------------------------------
      # Spring Boot maps SPRING_DATASOURCE_URL to spring.datasource.url automatically
      # (relaxed binding), so application.properties does not need to be edited.
      #
      # IMPORTANT: the host is "products-db", the NAME OF THE SERVICE, not localhost.
      # Inside the compose network Docker runs an internal DNS that resolves every
      # service name to the IP of its container. "localhost" would point to the API
      # container itself, where there is no PostgreSQL listening.
      SPRING_DATASOURCE_URL: jdbc:postgresql://products-db:5432/products_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # --- MEMORY: smaller connection pool --------------------------------------------
      # application.properties sets 10 connections; on a 1 GB instance 5 is plenty and
      # each open connection costs memory on BOTH sides (client and PostgreSQL server).
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"

      # --- DATABASE INITIALIZATION ----------------------------------------------------
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always

      # --- CORS -----------------------------------------------------------------------
      # The frontend is served from another origin (http://<public-ip>:5500), so the
      # browser needs the API to allow it. "*" allows any origin: this API is public,
      # stateless and does not use cookies, so there is no credential to protect.
      # In a real production system, replace it with the exact origin, for example:
      #   APP_CORS_ALLOWED_ORIGINS="https://my-app.example.com"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}

    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # busybox wget (already present in the Alpine image) checks that the API answers.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/products || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - products-network

# -------------------------------------------------------------------------------------
#  RESOURCES
# -------------------------------------------------------------------------------------
volumes:
  postgres_data:

networks:
  products-network:
    # Bridge network: the containers can reach each other by service name, but they
    # are isolated from the rest of the host.
    driver: bridge
